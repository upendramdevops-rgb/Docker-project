<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Ticket Booking</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* The background image of a flight */
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), 
                        url('https://images.unsplash.com/photo-1436491865332-7a61a109cc05?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            /* Glassmorphism effect */
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 550px;
            padding: 35px;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            text-align: center;
            color: #0077b6;
            margin-bottom: 8px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #555;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .row {
            display: flex;
            gap: 15px;
        }

        .row .form-group {
            flex: 1;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
            background: #fafafa;
        }

        input:focus, select:focus {
            border-color: #0077b6;
            background: #fff;
            box-shadow: 0 0 8px rgba(0, 119, 182, 0.2);
        }

        button {
            width: 100%;
            padding: 15px;
            background: #0077b6;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
            margin-top: 10px;
        }

        button:hover {
            background: #005f92;
        }

        button:active {
            transform: scale(0.98);
        }

        .ticket {
            display: none;
            margin-top: 25px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .ticket-header {
            background: #0077b6;
            color: #fff;
            padding: 15px;
            text-align: center;
            position: relative;
        }

        .ticket-header h2 {
            font-size: 22px;
            margin-bottom: 3px;
            letter-spacing: 1px;
        }

        .ticket-header p {
            font-size: 12px;
            opacity: 0.9;
        }

        .ticket-body {
            background: #fdfdfd;
            padding: 20px;
            border: 2px dashed #0077b6;
            border-top: none;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
        }

        .ticket-row {
            display: flex;
            justify-content: space-between;
            padding: 9px 0;
            border-bottom: 1px solid #eee;
            font-size: 15px;
        }

        .ticket-row:last-child {
            border-bottom: none;
        }

        .ticket-row span:first-child {
            color: #777;
            font-weight: 600;
        }

        .ticket-row span:last-child {
            color: #222;
            font-weight: 700;
        }

        .total-row span:last-child {
            color: #0077b6;
            font-size: 18px;
        }

        .success {
            text-align: center;
            color: #28a745;
            font-weight: bold;
            margin-top: 15px;
            font-size: 14px;
        }

        .barcode {
            text-align: center;
            margin-top: 15px;
            font-family: 'Courier New', monospace;
            letter-spacing: 3px;
            color: #333;
            font-size: 22px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>✈️ Upendra Airlines</h1>
    <p class="subtitle">Book your flight in seconds</p>

    <form id="bookingForm">
        <div class="form-group">
            <label for="name">Passenger Name</label>
            <input type="text" id="name" placeholder="Enter your full name" required>
        </div>

        <div class="row">
            <div class="form-group">
                <label for="from">From</label>
                <input type="text" id="from" placeholder="e.g. Hyderabad (HYD)" required>
            </div>
            <div class="form-group">
                <label for="to">To</label>
                <input type="text" id="to" placeholder="e.g. Dubai (DXB)" required>
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label for="date">Departure Date</label>
                <input type="date" id="date" required>
            </div>
            <div class="form-group">
                <label for="passengers">Passengers</label>
                <select id="passengers">
                    <option value="1">1 Passenger</option>
                    <option value="2">2 Passengers</option>
                    <option value="3">3 Passengers</option>
                    <option value="4">4 Passengers</option>
                    <option value="5">5 Passengers</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label for="class">Class</label>
            <select id="class" required>
                <option value="">-- Select Class --</option>
                <option value="Economy">Economy (₹5,000)</option>
                <option value="Business">Business (₹15,000)</option>
                <option value="First Class">First Class (₹30,000)</option>
            </select>
        </div>

        <button type="submit">Book Flight</button>
    </form>

    <div class="ticket" id="ticket">
        <div class="ticket-header">
            <h2>✈️ Boarding Pass</h2>
            <p>Upendra Airlines - Official Ticket</p>
        </div>
        <div class="ticket-body">
            <div class="ticket-row"><span>Passenger</span><span id="tName"></span></div>
            <div class="ticket-row"><span>From</span><span id="tFrom"></span></div>
            <div class="ticket-row"><span>To</span><span id="tTo"></span></div>
            <div class="ticket-row"><span>Date</span><span id="tDate"></span></div>
            <div class="ticket-row"><span>Passengers</span><span id="tPassengers"></span></div>
            <div class="ticket-row"><span>Class</span><span id="tClass"></span></div>
            <div class="ticket-row total-row"><span>Total Fare</span><span id="tFare"></span></div>
            <div class="ticket-row"><span>Booking ID</span><span id="tId"></span></div>
            <div class="barcode">||| || |||| ||| ||</div>
            <p class="success">✅ Flight Booked Successfully!</p>
        </div>
    </div>
</div>

<script>
    // Base prices for different classes
    const PRICES = {
        'Economy': 5000,
        'Business': 15000,
        'First Class': 30000
    };

    document.getElementById('bookingForm').addEventListener('submit', function (e) {
        e.preventDefault();

        // Get values from form
        const name       = document.getElementById('name').value;
        const from       = document.getElementById('from').value;
        const to         = document.getElementById('to').value;
        const date       = document.getElementById('date').value;
        const passengers = parseInt(document.getElementById('passengers').value);
        const flightClass = document.getElementById('class').value;

        // Calculate total fare
        const totalFare = PRICES[flightClass] * passengers;

        // Generate a random booking ID
        const bookingId = 'FL-' + Math.floor(100000 + Math.random() * 900000);

        // Fill ticket details
        document.getElementById('tName').textContent       = name;
        document.getElementById('tFrom').textContent       = from;
        document.getElementById('tTo').textContent         = to;
        document.getElementById('tDate').textContent       = date;
        document.getElementById('tPassengers').textContent = passengers;
        document.getElementById('tClass').textContent      = flightClass;
        document.getElementById('tFare').textContent       = '₹' + totalFare.toLocaleString();
        document.getElementById('tId').textContent         = bookingId;

        // Show the ticket
        document.getElementById('ticket').style.display = 'block';

        // Reset the form
        this.reset();

        // Scroll to ticket
        document.getElementById('ticket').scrollIntoView({ behavior: 'smooth' });
    });
</script>

</body>
</html>
