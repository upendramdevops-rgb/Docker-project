<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Ticket Booking</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            border-radius: 15px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 520px;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #e94560;
            margin-bottom: 8px;
            font-size: 26px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #eee;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
            background: #fafafa;
        }

        input:focus, select:focus {
            border-color: #e94560;
            background: #fff;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #e94560;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
            margin-top: 10px;
        }

        button:hover {
            background: #c73650;
        }

        button:active {
            transform: scale(0.98);
        }

        .ticket {
            display: none;
            margin-top: 25px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        .ticket-header {
            background: #e94560;
            color: #fff;
            padding: 15px;
            text-align: center;
        }

        .ticket-header h2 {
            font-size: 20px;
            margin-bottom: 3px;
        }

        .ticket-header p {
            font-size: 12px;
            opacity: 0.9;
        }

        .ticket-body {
            background: #fdfdfd;
            padding: 20px;
            border: 2px dashed #e94560;
            border-top: none;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
        }

        .ticket-row {
            display: flex;
            justify-content: space-between;
            padding: 9px 0;
            border-bottom: 1px solid #eee;
            font-size: 15px;
        }

        .ticket-row:last-child {
            border-bottom: none;
        }

        .ticket-row span:first-child {
            color: #777;
            font-weight: 600;
        }

        .ticket-row span:last-child {
            color: #222;
            font-weight: 700;
        }

        .total-row span:last-child {
            color: #e94560;
            font-size: 18px;
        }

        .success {
            text-align: center;
            color: #28a745;
            font-weight: bold;
            margin-top: 15px;
            font-size: 14px;
        }

        .barcode {
            text-align: center;
            margin-top: 15px;
            font-family: 'Courier New', monospace;
            letter-spacing: 3px;
            color: #333;
            font-size: 22px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎬 Movie Ticket Booking</h1>
    <p class="subtitle">Book your favorite movie in seconds</p>

    <form id="bookingForm">
        <div class="form-group">
            <label for="name">Customer Name</label>
            <input type="text" id="name" placeholder="Enter your name" required>
        </div>

        <div class="form-group">
            <label for="movie">Select Movie</label>
            <select id="movie" required>
                <option value="">-- Choose a Movie --</option>
                <option value="Leo">Leo</option>
                <option value="Jailer">Jailer</option>
                <option value="Animal">Animal</option>
                <option value="Oppenheimer">Oppenheimer</option>
                <option value="Barbie">Barbie</option>
            </select>
        </div>

        <div class="form-group">
            <label for="showtime">Show Time</label>
            <select id="showtime" required>
                <option value="">-- Choose a Show Time --</option>
                <option value="10:00 AM">10:00 AM</option>
                <option value="02:00 PM">02:00 PM</option>
                <option value="06:00 PM">06:00 PM</option>
                <option value="10:00 PM">10:00 PM</option>
            </select>
        </div>

        <div class="form-group">
            <label for="date">Show Date</label>
            <input type="date" id="date" required>
        </div>

        <div class="form-group">
            <label for="tickets">Number of Tickets</label>
            <select id="tickets">
                <option value="1">1 Ticket</option>
                <option value="2">2 Tickets</option>
                <option value="3">3 Tickets</option>
                <option value="4">4 Tickets</option>
                <option value="5">5 Tickets</option>
                <option value="6">6 Tickets</option>
            </select>
        </div>

        <button type="submit">Book Tickets</button>
    </form>

    <div class="ticket" id="ticket">
        <div class="ticket-header">
            <h2>🎟️ Movie Ticket</h2>
            <p>Upendra Cinemas</p>
        </div>
        <div class="ticket-body">
            <div class="ticket-row"><span>Customer</span><span id="tName"></span></div>
            <div class="ticket-row"><span>Movie</span><span id="tMovie"></span></div>
            <div class="ticket-row"><span>Show Time</span><span id="tTime"></span></div>
            <div class="ticket-row"><span>Date</span><span id="tDate"></span></div>
            <div class="ticket-row"><span>Tickets</span><span id="tTickets"></span></div>
            <div class="ticket-row total-row"><span>Total Fare</span><span id="tFare"></span></div>
            <div class="ticket-row"><span>Booking ID</span><span id="tId"></span></div>
            <div class="barcode">|||| ||| || ||||</div>
            <p class="success">✅ Booking Confirmed!</p>
        </div>
    </div>
</div>

<script>
    const PRICE_PER_TICKET = 250; // Base ticket price in INR

    document.getElementById('bookingForm').addEventListener('submit', function (e) {
        e.preventDefault();

        // Get values from form
        const name     = document.getElementById('name').value;
        const movie    = document.getElementById('movie').value;
        const showtime = document.getElementById('showtime').value;
        const date     = document.getElementById('date').value;
        const tickets  = parseInt(document.getElementById('tickets').value);

        // Calculate total fare
        const totalFare = tickets * PRICE_PER_TICKET;

        // Generate a random booking ID
        const bookingId = 'MOV-' + Math.floor(100000 + Math.random() * 900000);

        // Fill ticket details
        document.getElementById('tName').textContent    = name;
        document.getElementById('tMovie').textContent   = movie;
        document.getElementById('tTime').textContent    = showtime;
        document.getElementById('tDate').textContent    = date;
        document.getElementById('tTickets').textContent = tickets;
        document.getElementById('tFare').textContent    = '₹' + totalFare;
        document.getElementById('tId').textContent      = bookingId;

        // Show the ticket
        document.getElementById('ticket').style.display = 'block';

        // Reset the form
        this.reset();

        // Scroll to ticket
        document.getElementById('ticket').scrollIntoView({ behavior: 'smooth' });
    });
</script>

</body>
</html>
