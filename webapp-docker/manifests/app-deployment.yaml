---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devopsapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: swiggy
  template:
    metadata:
      labels:
        app: swiggy
    spec:
      containers:
        - name: cont-1
          image: upendra9010/k8sfirst:appimage
          ports:
            - containerPort: 8080
      imagePullSecrets:
        - name: flm
